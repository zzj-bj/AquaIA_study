# Z: !Warning! actual yaml not used
# AquaIA - Generic DETR+DINO training config
#
# This file follows the same structure and naming convention as
# Detection/YOLO/yolo_train_config.yaml wherever the concepts match.

# ----------------------------------------------------------------------
# Model section: detector choice / initialization
# ----------------------------------------------------------------------
model:
  family: "dinov3"
  size : "s"
  init: "random"

# ----------------------------------------------------------------------
# Data section: train/val dataset
# ----------------------------------------------------------------------
data:
  # Dataset path consumed by the DINO trainer.
  dataset_yaml: "../../datasets/coco_custom"
  # Image loader used by the DINO trainer. Use "npy" to keep the legacy path.
  loader: "jpg"

# ----------------------------------------------------------------------
# Output section: training artifact handling
# ----------------------------------------------------------------------
output:
  # Output directory. Relative path is resolved from YAML directory.
  # Z: parent folder of result folder
  project: "../../results/detection/detr"
  exist_ok: true
  # Z: not used
  save: true
  # Z: not used
  save_period: 0
  # Z: not used
  plots: false

  # Optional: export the fully-resolved config used at runtime.
  # Z: not used
  write_config: true
  # Z: not used
  config_filename: "resolved_config.yaml"

# ----------------------------------------------------------------------
# Training section: arguments used by the DINO trainer
# ----------------------------------------------------------------------
training:
  # ---------- CORE TASK / MODE ----------
  task: "detect"
  # Z: not used
  mode: "train"

  # ---------- DEVICE ----------
  device: "auto"

  # ---------- DATA INPUT / LOADING ----------
  imgsz: 640
  batch: 64
  # Z: not used
  workers: 0

  # ---------- TRAINING SCHEDULE ----------
  epochs: 3500
  # Z: if cos_lr, warmup steps = epochs * warmup_ratio
  warmup_ratio: 0.05

  # ---------- OPTIMIZER & LR ----------
  optimizer: "AdamW"
  lr0: 0.0005
  # Z: min lr for cosine scheduler = lrf * lr0
  lrf: 0.05
  cos_lr: true
  # Z: weight decay for optimizer
  weight_decay: 0.00005

  # ---------- LOSS / MATCHER HYPERPARAMETERS ----------
  # Z: weights for class, bbox, giou in matching cost
  cost_class: 2.0
  cost_bbox: 5.0
  cost_giou: 2.0
  # Z: L1 distance
  cost_bbox_type: "l1"
  # Z: weights for class, bbox, giou in Hungarian loss
  cls: 4.0
  box: 5.0
  giou: 2.0

  # ---------- INFERENCE / EVAL-RELATED ----------
  # Z: conf threshold during result saving
  conf: 0.05
  # Z: not used
  iou: 0.5
  # Z: not used
  val: true

  # ---------- PERFORMANCE / MISC ----------
  # Z: torch.compile() attempts to optimize the model's forward computation graph
  # Z: to make training or inference faster
  compile: true
