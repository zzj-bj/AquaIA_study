# ----------------------------------------------------------------------
# Model section: 
# ----------------------------------------------------------------------
model:
  family: "dinov3"
  size : "small"
  # Z: DINO uses it to create output dir, YOLO uses it to load .pt or .yaml
  init: "pretrained"   # "pretrained" or "random"

# ----------------------------------------------------------------------
# Data section: train/val dataset
# ----------------------------------------------------------------------
data:
  # Dataset path consumed by the DINO trainer.
  dataset_yaml: "datasets/coco_custom_match"

# ----------------------------------------------------------------------
# Output section: training artifact handling
# ----------------------------------------------------------------------
output:
  # Root directory for run folders. Each run creates output/{YYYYMMDD_HHMMSS}/.
  # Z: !Warning! not used, overided by load_train_config()
  project: "runs"
  # Z: only for YOLO
  exist_ok: true
  # Z: only for YOLO
  save_period: 0
  # Z: only for YOLO
  plots: true

# ----------------------------------------------------------------------
# Logging section: persistent logs and checkpointing
# ----------------------------------------------------------------------
logging:
  # Save last.pt + last_training_state.pt every N epochs (0 = only at end).
  # Z: only for DINO
  save_period: 5
  # Update the heartbeat file every N batches.
  # Z: only for DINO
  heartbeat_every_n_batches: 10
  # Path to the global run registry (one JSON line per run).
  # Z: only for DINO
  registry_path: "runs/registry.jsonl"

# ----------------------------------------------------------------------
# Training section: arguments used by the DINO trainer
# ----------------------------------------------------------------------
training:
  # ---------- CORE TASK / MODE ----------
  # Z: both use it to create output dir, YOLO uses it to specify the training task
  task: "detect"
  # Z: only for YOLO
  mode: "train"

  # ---------- DEVICE ----------
  device: "auto"

  # ---------- DATA INPUT / LOADING ----------
  imgsz: 640
  batch: 30
  # Z: only for YOLO
  workers: 0

  # ---------- TRAINING SCHEDULE ----------
  epochs: 2
  # Z: if cos_lr, warmup steps = epochs * warmup_ratio 
  # Z: only for DINO
  warmup_ratio: 0.05

  # ---------- OPTIMIZER & LR ----------
  optimizer: "AdamW"
  lr0: 0.0005
  # Z: min lr for cosine scheduler = lrf * lr0
  lrf: 0.05
  cos_lr: true
  # Z: weight decay for optimizer
  weight_decay: 0.00005

  # ---------- LOSS / MATCHER HYPERPARAMETERS ----------
  # Z: weights for class, bbox, giou in matching cost
  # Z: only for DINO
  cost_class: 2.0
  # Z: only for DINO
  cost_bbox: 5.0
  # Z: only for DINO
  cost_giou: 2.0
  # Z: only for DINO
  cost_bbox_type: "l1"
  # Z: weights for class, bbox, giou in loss
  cls: 4.0
  box: 5.0
  # Z: only for DINO
  giou: 2.0

  # ---------- LOSS / BOX / CLS HYPERPARAMETERS ----------
  # See Ultralytics default.yaml for the latest recommended defaults.
  # box: 7.5            # box loss gain
  # cls: 0.5            # classification loss gain
  # dfl: 1.5            # distribution focal loss gain

  # ---------- DATA AUGMENTATION ----------
  # Z: only for YOLO
  augment: true

  # Color jitter in HSV space.
  # Z: only for YOLO
  hsv_h: 0.005
  # Z: only for YOLO
  hsv_s: 0.1
  # Z: only for YOLO
  hsv_v: 0.1

  # Geometric transforms.
  # Z: only for YOLO
  degrees: 180.0
  # Z: only for YOLO
  translate: 0.1
  # Z: only for YOLO
  scale: 0.2
  # Z: only for YOLO
  shear: 1.0
  # Z: only for YOLO
  perspective: 0.0005

  # Flips.
  # Z: only for YOLO
  flipud: 0.5
  # Z: only for YOLO
  fliplr: 0.5

  # Advanced augmentations.
  # Z: only for YOLO
  #bgr: 0.0
  # Z: only for YOLO
  mosaic: 0.1
  # Z: only for YOLO
  mixup: 0.05
  # Z: only for YOLO
  cutmix: 0.05

  # Disable mosaic in the last N epochs to stabilize training.
  # Z: only for YOLO
  close_mosaic: 20

  # ---------- INFERENCE / EVAL-RELATED ----------
  # Confidence threshold for mAP calculation
  conf_thresh: 0.05
  # Confidence threshold for bbox filtering
  # Z: DINO uses it to filter training-set visualization predictions
  # Z: YOLO uses it as the confidence threshold during validation
  conf: 0.3
  # Z: only for YOLO
  iou: 0.5
  # Z: only for YOLO
  val: true

  # ---------- PERFORMANCE / MISC ----------
  # Z: torch.compile() attempts to optimize the model's forward computation graph
  # Z: to make training or inference faster
  compile: true
